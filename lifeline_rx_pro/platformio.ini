; PlatformIO Project Configuration File
; LifeLine RX Pro - ESP32 Emergency Receiver

[platformio]
src_dir = .
default_envs = esp32dev

; ═══════════════════════════════════════════════════════════════════════════════════
; DEFAULT USB SERIAL UPLOAD ENVIRONMENT
; ═══════════════════════════════════════════════════════════════════════════════════
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

; ═══════════════════════════════════════════════════════════════════════════════════
; WIRELESS OTA UPLOAD ENVIRONMENT (Triggered by 3 Wi-Fi button presses)
; ═══════════════════════════════════════════════════════════════════════════════════
[env:esp32dev_ota]
platform = espressif32
board = esp32dev
framework = arduino
upload_protocol = espota
upload_port = 192.168.4.1

lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
