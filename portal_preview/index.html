<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeLine Hardware // Web Portal Design System Showroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-0: #000000;
      --bg-1: #0d0d0d;
      --bg-2: #141414;
      --bg-3: #1f1f1f;
      --bg-4: #262626;
      --border: #262626;
      --border-strong: #3a3a3a;
      --text-0: #ffffff;
      --text-1: #cccccc;
      --text-2: #999999;
      --text-3: #666666;
      --radius: 0px;
      --radius-btn: 9999px;
      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: var(--radius);
    }

    body {
      background: var(--bg-0);
      color: var(--text-1);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Fixed Top Ambient Rail */
    .top-progress-rail {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #06b6d4, #8b5cf6, #f59e0b);
      z-index: 1000;
      box-shadow: 0 0 16px rgba(99, 102, 241, 0.7);
    }

    /* Top Cockpit Bar */
    .cockpit-header {
      background: rgba(13, 13, 13, 0.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 500;
    }

    .cockpit-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cockpit-logo-badge {
      width: 32px;
      height: 32px;
      background: #ffffff;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 14px;
    }

    .cockpit-title-box h1 {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-0);
    }

    .cockpit-title-box .sub {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-3);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    /* Control Groups in Header */
    .control-deck {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .switch-group {
      display: flex;
      background: var(--bg-1);
      border: 1px solid var(--border-strong);
      padding: 3px;
    }

    .switch-btn {
      background: transparent;
      border: none;
      color: var(--text-2);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .switch-btn:hover {
      color: var(--text-0);
    }

    .switch-btn.active {
      background: var(--text-0);
      color: var(--bg-0);
    }

    /* Viewport Sizer Buttons */
    .viewport-group {
      display: flex;
      background: var(--bg-1);
      border: 1px solid var(--border);
      padding: 3px;
    }

    .viewport-btn {
      background: transparent;
      border: none;
      color: var(--text-3);
      padding: 6px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .viewport-btn:hover {
      color: var(--text-0);
    }

    .viewport-btn.active {
      background: var(--bg-3);
      color: #06b6d4;
    }

    .open-full-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      background: transparent;
      border: 1px solid var(--border-strong);
      color: var(--text-0);
      font-family: var(--font-mono);
      font-size: 11px;
      text-decoration: none;
      border-radius: var(--radius-btn);
      transition: all 0.2s;
    }

    .open-full-btn:hover {
      background: #ffffff;
      color: #000000;
    }

    /* Main Showcase Canvas */
    .showcase-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 32px 16px 24px;
      background: radial-gradient(circle at top, rgba(20, 20, 30, 0.6) 0%, #000000 70%);
      transition: all 0.3s ease;
    }

    /* Preview IFrame Wrapper */
    .frame-container {
      width: 100%;
      max-width: 100%;
      height: 860px;
      background: #000000;
      border: 1px solid var(--border-strong);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: max-width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .frame-container.viewport-mobile {
      max-width: 430px;
      height: 820px;
      border: 2px solid #333333;
      box-shadow: 0 0 40px rgba(0,0,0,0.8);
    }

    .frame-container.viewport-tablet {
      max-width: 768px;
      height: 860px;
      border: 2px solid #333333;
    }

    .frame-container.viewport-desktop {
      max-width: 1200px;
      height: 880px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #000000;
    }

    /* Design Tokens Bar at Bottom */
    .token-bar {
      background: var(--bg-1);
      border-top: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      font-family: var(--font-mono);
      font-size: 11px;
    }

    .token-swatches {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .swatch {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: var(--text-2);
    }

    .swatch-color {
      width: 14px;
      height: 14px;
      border: 1px solid var(--border-strong);
    }

    .token-summary {
      color: var(--text-3);
    }

    .token-summary strong {
      color: var(--text-1);
    }
  </style>
</head>
<body>

  <div class="top-progress-rail"></div>

  <!-- Master Cockpit Header -->
  <header class="cockpit-header">
    <div class="cockpit-brand">
      <div class="cockpit-logo-badge">LL</div>
      <div class="cockpit-title-box">
        <h1>LIFELINE DESIGN SHOWROOM</h1>
        <div class="sub">Bugatti Luxury System // Live OTA &amp; Wi-Fi Portals</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="control-deck">
      
      <!-- Device Selector -->
      <div class="switch-group">
        <button class="switch-btn active" id="btn_tx_select">TX Tactical Unit</button>
        <button class="switch-btn" id="btn_rx_select">RX Base Station</button>
      </div>

      <!-- Viewport Device Resizer -->
      <div class="viewport-group">
        <!-- Mobile -->
        <button class="viewport-btn" id="vp_mobile" title="Mobile (430px)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="2"></rect>
            <line x1="12" y1="18" x2="12" y2="18"></line>
          </svg>
        </button>
        <!-- Tablet -->
        <button class="viewport-btn" id="vp_tablet" title="Tablet (768px)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="2" width="16" height="20" rx="2"></rect>
            <line x1="12" y1="18" x2="12" y2="18"></line>
          </svg>
        </button>
        <!-- Desktop -->
        <button class="viewport-btn active" id="vp_desktop" title="Desktop Frame (1200px)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </button>
      </div>

      <!-- Launch Full Page Link -->
      <a href="tx_portal.html" target="_blank" class="open-full-btn" id="btn_open_tab">
        <span>Launch Fullscreen</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>

    </div>
  </header>

  <!-- Interactive Stage -->
  <main class="showcase-stage">
    <div class="frame-container viewport-desktop" id="frame_container">
      <iframe src="tx_portal.html" id="preview_iframe"></iframe>
    </div>
  </main>

  <!-- Design Token Swatches Bar -->
  <footer class="token-bar">
    <div class="token-swatches">
      <div class="swatch">
        <span class="swatch-color" style="background:#000000;"></span>
        <span>--bg-0 Pure Black</span>
      </div>
      <div class="swatch">
        <span class="swatch-color" style="background:#0d0d0d;"></span>
        <span>--bg-1 Soft</span>
      </div>
      <div class="swatch">
        <span class="swatch-color" style="background:#141414;"></span>
        <span>--bg-2 Card</span>
      </div>
      <div class="swatch">
        <span class="swatch-color" style="background:#6366f1;"></span>
        <span>Indigo</span>
      </div>
      <div class="swatch">
        <span class="swatch-color" style="background:#06b6d4;"></span>
        <span>Cyan</span>
      </div>
      <div class="swatch">
        <span class="swatch-color" style="background:#ff1e42;"></span>
        <span>Crimson</span>
      </div>
    </div>
    <div class="token-summary">
      Geometry: <strong>0px radius</strong> | Buttons: <strong>9999px pill</strong> | Typography: <strong>Space Grotesk + JetBrains Mono</strong>
    </div>
  </footer>

  <script>
    const iframe = document.getElementById('preview_iframe');
    const btnTx = document.getElementById('btn_tx_select');
    const btnRx = document.getElementById('btn_rx_select');
    const frameContainer = document.getElementById('frame_container');
    const btnOpenTab = document.getElementById('btn_open_tab');

    const vpMobile = document.getElementById('vp_mobile');
    const vpTablet = document.getElementById('vp_tablet');
    const vpDesktop = document.getElementById('vp_desktop');

    let currentDevice = 'tx';

    function setDevice(device) {
      currentDevice = device;
      if (device === 'tx') {
        btnTx.classList.add('active');
        btnRx.classList.remove('active');
        iframe.src = 'tx_portal.html';
        btnOpenTab.href = 'tx_portal.html';
      } else {
        btnRx.classList.add('active');
        btnTx.classList.remove('active');
        iframe.src = 'rx_portal.html';
        btnOpenTab.href = 'rx_portal.html';
      }
    }

    btnTx.addEventListener('click', () => setDevice('tx'));
    btnRx.addEventListener('click', () => setDevice('rx'));

    // Viewport resizing
    function setViewport(mode) {
      [vpMobile, vpTablet, vpDesktop].forEach(b => b.classList.remove('active'));
      frameContainer.classList.remove('viewport-mobile', 'viewport-tablet', 'viewport-desktop');

      if (mode === 'mobile') {
        vpMobile.classList.add('active');
        frameContainer.classList.add('viewport-mobile');
      } else if (mode === 'tablet') {
        vpTablet.classList.add('active');
        frameContainer.classList.add('viewport-tablet');
      } else {
        vpDesktop.classList.add('active');
        frameContainer.classList.add('viewport-desktop');
      }
    }

    vpMobile.addEventListener('click', () => setViewport('mobile'));
    vpTablet.addEventListener('click', () => setViewport('tablet'));
    vpDesktop.addEventListener('click', () => setViewport('desktop'));
  </script>
</body>
</html>
