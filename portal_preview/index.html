<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LifeLine Hardware // Portal Design Showroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --canvas: #f8f9fa;
      --card-outer: #ededf0;
      --card-border: #dcdde2;
      --tab-bg: #e5e6eb;
      --tab-border: #d2d4dc;
      --tab-text: #4b5563;
      --tab-active-bg: #000000;
      --tab-active-text: #ffffff;
      --tab-active-border: #000000;
      --text-main: #000000;
      --text-sub: #4b5563;
      --text-muted: #6b7280;
      --badge-bg: #ffffff;
      --badge-border: #d1d5db;
      --badge-text: #111827;
      --frame-border: #d1d5db;
      --accent-color: #000000;
    }

    [data-theme="dark"] {
      --canvas: #09090b;
      --card-outer: #141417;
      --card-border: #27272a;
      --tab-bg: #1c1c21;
      --tab-border: #2e2e34;
      --tab-text: #9ca3af;
      --tab-active-bg: #ffffff;
      --tab-active-text: #000000;
      --tab-active-border: #ffffff;
      --text-main: #ffffff;
      --text-sub: #9ca3af;
      --text-muted: #6b7280;
      --badge-bg: #141417;
      --badge-border: #2e2e34;
      --badge-text: #e5e7eb;
      --frame-border: #333338;
      --accent-color: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--canvas);
      color: var(--text-main);
      transition: background 0.25s, color 0.25s;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 20px;
    }

    .cockpit-container {
      width: 100%;
      max-width: 1240px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Top Bar */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 9999px;
      border: 1px solid var(--badge-border);
      background: var(--badge-bg);
      color: var(--badge-text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 9999px;
      border: 1px solid var(--badge-border);
      background: var(--badge-bg);
      color: var(--badge-text);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-pill:hover {
      border-color: var(--accent-color);
    }

    /* Titles */
    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .hero-sub {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 10px;
    }

    /* Controls Bar: Device Switcher + Viewport Sizers */
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .segmented-tabs {
      display: flex;
      gap: 6px;
    }

    .seg-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 16px;
      border: 1px solid var(--tab-border);
      background: var(--tab-bg);
      color: var(--tab-text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .seg-tab.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
      border-color: var(--tab-active-border);
    }

    .vp-group {
      display: flex;
      gap: 4px;
      background: var(--card-outer);
      border: 1px solid var(--card-border);
      padding: 3px;
    }

    .vp-btn {
      background: transparent;
      border: none;
      padding: 4px 10px;
      color: var(--text-sub);
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .vp-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-text);
    }

    /* Screen Stage Frame */
    .stage-wrapper {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .stage-frame {
      width: 100%;
      height: 100%;
      border: 1px solid var(--frame-border);
      background: var(--canvas);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      transition: max-width 0.25s ease;
      overflow: hidden;
      position: relative;
    }

    .stage-frame.vp-desktop {
      max-width: 100%;
    }

    .stage-frame.vp-tablet {
      max-width: 768px;
    }

    .stage-frame.vp-mobile {
      max-width: 420px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Footer */
    .footer-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--text-muted);
      padding-top: 4px;
    }

    @media (max-width: 768px) {
      .hero-title { font-size: 20px; }
      .hero-sub { font-size: 11px; margin-bottom: 6px; }
      .vp-group { display: none; }
      .seg-tab { padding: 5px 10px; font-size: 10px; }
    }
  </style>
</head>
<body>

  <div class="cockpit-container">

    <!-- Top Header -->
    <div class="top-header">
      <div class="badge-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:12px;height:12px;">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>PORTAL SHOWROOM // ONE SCREEN FIT</span>
      </div>

      <div class="header-actions">
        <!-- Theme Toggle -->
        <button class="btn-pill" id="theme_toggle">
          <span id="theme_icon">☀️</span>
          <span id="theme_label">LIGHT</span>
        </button>
        <!-- Direct Fullscreen Link -->
        <a href="tx_portal.html" target="_blank" class="btn-pill" id="btn_fullscreen">
          <span>OPEN DIRECT</span>
          <span>&nearr;</span>
        </a>
      </div>
    </div>

    <!-- Title & Subtitle -->
    <div>
      <h1 class="hero-title">Four services. One platform.</h1>
      <p class="hero-sub">Single-screen responsive portals for LifeLine TX Tactical Unit and RX Base Station.</p>
    </div>

    <!-- Control Row: Device Tabs & Viewport Sizers -->
    <div class="control-row">
      <div class="segmented-tabs">
        <button class="seg-tab active" id="btn_select_tx" onclick="selectDevice('tx')">
          <span>TX TACTICAL UNIT</span>
        </button>
        <button class="seg-tab" id="btn_select_rx" onclick="selectDevice('rx')">
          <span>RX BASE STATION</span>
        </button>
      </div>

      <div class="vp-group">
        <button class="vp-btn" id="vp_mobile" onclick="setViewport('mobile')">MOBILE (420px)</button>
        <button class="vp-btn" id="vp_tablet" onclick="setViewport('tablet')">TABLET (768px)</button>
        <button class="vp-btn active" id="vp_desktop" onclick="setViewport('desktop')">PC FULL (100%)</button>
      </div>
    </div>

    <!-- Stage Wrapper with Iframe (Fitted in 1 Screen Frame) -->
    <div class="stage-wrapper">
      <div class="stage-frame vp-desktop" id="stage_frame">
        <iframe src="tx_portal.html" id="preview_iframe"></iframe>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-bar">
      <span>THEME: REFERENCE IMAGE EXACT MATCH (LIGHT + DARK MODE)</span>
      <span>LAYOUT: SINGLE SCREEN VIEWPORT FIT</span>
    </div>

  </div>

  <script>
    const htmlEl = document.documentElement;
    const themeToggle = document.getElementById('theme_toggle');
    const themeIcon = document.getElementById('theme_icon');
    const themeLabel = document.getElementById('theme_label');
    const iframe = document.getElementById('preview_iframe');
    const stageFrame = document.getElementById('stage_frame');
    const btnTx = document.getElementById('btn_select_tx');
    const btnRx = document.getElementById('btn_select_rx');
    const btnFullscreen = document.getElementById('btn_fullscreen');

    let currentDevice = 'tx';

    function applyTheme(theme) {
      htmlEl.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        themeIcon.textContent = '🌙';
        themeLabel.textContent = 'DARK';
      } else {
        themeIcon.textContent = '☀️';
        themeLabel.textContent = 'LIGHT';
      }
      localStorage.setItem('lifeline_theme', theme);
      // Sync theme to iframe
      try {
        if (iframe.contentWindow && iframe.contentWindow.document) {
          iframe.contentWindow.document.documentElement.setAttribute('data-theme', theme);
          if (iframe.contentWindow.applyTheme) {
            iframe.contentWindow.applyTheme(theme);
          }
        }
      } catch(e) {}
    }

    const savedTheme = localStorage.getItem('lifeline_theme') || 'light';
    applyTheme(savedTheme);

    themeToggle.addEventListener('click', () => {
      const current = htmlEl.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });

    function selectDevice(device) {
      currentDevice = device;
      if (device === 'tx') {
        btnTx.classList.add('active');
        btnRx.classList.remove('active');
        iframe.src = 'tx_portal.html';
        btnFullscreen.href = 'tx_portal.html';
      } else {
        btnRx.classList.add('active');
        btnTx.classList.remove('active');
        iframe.src = 'rx_portal.html';
        btnFullscreen.href = 'rx_portal.html';
      }
      iframe.onload = function() {
        try {
          iframe.contentWindow.document.documentElement.setAttribute('data-theme', htmlEl.getAttribute('data-theme'));
        } catch(e) {}
      };
    }

    function setViewport(mode) {
      document.querySelectorAll('.vp-btn').forEach(b => b.classList.remove('active'));
      stageFrame.classList.remove('vp-desktop', 'vp-tablet', 'vp-mobile');
      if (mode === 'mobile') {
        document.getElementById('vp_mobile').classList.add('active');
        stageFrame.classList.add('vp-mobile');
      } else if (mode === 'tablet') {
        document.getElementById('vp_tablet').classList.add('active');
        stageFrame.classList.add('vp-tablet');
      } else {
        document.getElementById('vp_desktop').classList.add('active');
        stageFrame.classList.add('vp-desktop');
      }
    }
  </script>
</body>
</html>
